name: Publish Release Binaries

# Triggered by a repository_dispatch event sent from the private build repo,
# or manually from the Actions tab.
#
# The private repo (financialAgent-private) calls this after its own build
# completes by sending a repository_dispatch event.
on:
  repository_dispatch:
    types: [new-release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.0)"
        required: true
      private_repo:
        description: "Source private repo (owner/repo)"
        required: true
        default: "malfihasan/financialAgent-private"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Resolve version and source repo
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            VERSION="${{ github.event.client_payload.version }}"
            PRIVATE_REPO="${{ github.event.client_payload.private_repo }}"
          else
            VERSION="${{ github.event.inputs.version }}"
            PRIVATE_REPO="${{ github.event.inputs.private_repo }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "private_repo=${PRIVATE_REPO}" >> "$GITHUB_OUTPUT"
          echo "Publishing v${VERSION} from ${PRIVATE_REPO}"

      - name: Update public release metadata
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          readme_path = Path("README.md")
          install_path = Path("INSTALL.md")
          version = os.environ["VERSION"]
          badge = (
              f"[![Latest Release](https://img.shields.io/badge/Latest%20Release-v{version}-brightgreen?style=flat-square)]"
              "(https://github.com/malfihasan/financialAgent-public/releases/latest)"
          )
          text = readme_path.read_text(encoding="utf-8")
          pattern = re.compile(
              r"^\[!\[Latest Release\]\([^\n]+\)\]"
              r"\(https://github\.com/malfihasan/financialAgent-public/releases/latest\)$",
              re.MULTILINE,
          )
          updated, count = pattern.subn(badge, text, count=1)
          if count != 1:
              raise SystemExit("Could not find README Latest Release badge line")
          readme_path.write_text(updated, encoding="utf-8")

          install_text = install_path.read_text(encoding="utf-8")
          release_base = "https://github.com/malfihasan/financialAgent-public/releases"
          install_text = re.sub(
              rf"{re.escape(release_base)}/(?:latest/download|download/v[^/]+)/"
              r"(?:FinAgent-)?(?:[0-9]+\.[0-9]+\.[0-9]+-)?Docker-x86_64\.tar\.gz",
              f"{release_base}/download/v{version}/FinAgent-{version}-Docker-x86_64.tar.gz",
              install_text,
          )
          install_text = re.sub(
              rf"{re.escape(release_base)}/(?:latest/download|download/v[^/]+)/(docker_up\.sh|docker-compose\.yml)",
              rf"{release_base}/download/v{version}/\1",
              install_text,
          )
          install_path.write_text(install_text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md INSTALL.md; then
            git add README.md INSTALL.md
            git commit -m "docs: update release metadata for v${VERSION}"
            git push
          else
            echo "Release metadata already up to date."
          fi

      - name: Download release assets from private repo
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          VERSION: ${{ steps.vars.outputs.version }}
          PRIVATE_REPO: ${{ steps.vars.outputs.private_repo }}
        run: |
          mkdir -p release-assets
          gh release download "v${VERSION}" \
            --repo "${PRIVATE_REPO}" \
            --dir release-assets \
            --pattern "FinAgent-*"
          gh release download "v${VERSION}" \
            --repo "${PRIVATE_REPO}" \
            --dir release-assets \
            --pattern "docker_up.sh"
          gh release download "v${VERSION}" \
            --repo "${PRIVATE_REPO}" \
            --dir release-assets \
            --pattern "docker-compose.yml"
          echo "Downloaded assets:"
          ls -lh release-assets/

      - name: Create stable latest-download aliases
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          cp "release-assets/FinAgent-${VERSION}-macOS.dmg" "release-assets/FinAgent-macOS.dmg"
          cp "release-assets/FinAgent-${VERSION}-Linux-x86_64.tar.gz" "release-assets/FinAgent-Linux-x86_64.tar.gz"
          cp "release-assets/FinAgent-${VERSION}-Windows-x64.exe" "release-assets/FinAgent-Windows-x64.exe"
          cp "release-assets/FinAgent-${VERSION}-Docker-x86_64.tar.gz" "release-assets/FinAgent-Docker-x86_64.tar.gz"
          echo "Release assets with stable aliases:"
          ls -lh release-assets/

      - name: Create public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.vars.outputs.version }}
          name: FinAgent v${{ steps.vars.outputs.version }}
          draft: false
          prerelease: false
          body_path: INSTALL.md
          files: release-assets/*

      - name: Keep only the 3 most recent releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,createdAt,isDraft \
            --jq 'map(select(.isDraft | not)) | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
          | while read -r tag; do
              echo "Deleting old release $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            done
